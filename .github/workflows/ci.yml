name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find cmd internal tests -name '*.go'))"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/app ./cmd/debugger
      - name: Validate Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Start local stack
        run: docker compose up --build -d
      - name: Wait for gateway and debugger
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:8081/api/health >/dev/null && curl -fsS http://127.0.0.1:3200/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run integration suite
        run: DDR_INTEGRATION=1 go test -tags=integration -timeout=180s ./tests/integration
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
